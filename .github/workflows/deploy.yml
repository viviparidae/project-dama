name: Deploy

on:
  pull_request:
    paths:
      - "app/**"
      - "src/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "tsconfig.json"
      - ".github/workflows/deploy.yml"
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "src/**"
      - "tests/**"
      - "docs/requirements/**"
      - "docs/quality/**"
      - "docs/pages/**"
      - "scripts/**"
      - ".github/skills/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "tsconfig.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  quality:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Python YAML dependency
        run: python3 -m pip install PyYAML

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Run Pages generator tests
        run: npm run test:python

      - name: Build application
        run: npm run build

  publish-pages:
    name: Publish requirements and quality dashboard
    needs: quality
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Python YAML dependency
        run: python3 -m pip install PyYAML

      - name: Generate Japanese requirements
        run: npm run requirements:humanize

      - name: Run tests and collect coverage
        run: npx vitest run --coverage --coverage.thresholds.lines=0 --coverage.thresholds.functions=0 --coverage.thresholds.branches=0 --reporter=json --outputFile=coverage/vitest-results.json

      - name: Ensure quality history branch exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/branches/quality-history" --silent >/dev/null 2>&1; then
            echo "Quality history branch already exists"
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref=refs/heads/quality-history \
              -f sha="$GITHUB_SHA"
          fi

      - name: Check out quality history
        uses: actions/checkout@v4
        with:
          ref: quality-history
          path: quality-history

      - name: Generate quality dashboard
        run: |
          python3 scripts/generate_quality_dashboard.py \
            coverage/vitest-results.json \
            coverage/coverage-final.json \
            docs/pages/quality-dashboard/index.html \
            --requirements docs/requirements/user-stories.yaml \
            --requirements-evidence docs/quality/requirements-status.json \
            --repository-root . \
            --history quality-history/history.json \
            --commit "$GITHUB_SHA"
          cp quality-history/history.json docs/pages/quality-dashboard/history.json

      - name: Save quality history
        working-directory: quality-history
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add history.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update quality metrics history"
            git push origin HEAD:quality-history
          fi

      - name: Verify GitHub Pages landing page
        run: test -f docs/pages/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy:
    name: Deploy to Vercel
    needs: quality
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Vercel project and build
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_ORG_ID" || { echo "::error::VERCEL_ORG_ID is not configured"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "::error::VERCEL_PROJECT_ID is not configured"; exit 1; }
          test -n "$VERCEL_TOKEN" || { echo "::error::VERCEL_TOKEN is not configured"; exit 1; }
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
