version: "1.0"
project: "Project Dama"
description: "進化的ミスマッチ解消のためのヘルスケア＆習慣化アプリ MVP ユーザーストーリー＆受け入れ基準"
created_at: "2026-10-07"
status: "Draft"

# =============================================================================
# ユーザーストーリー（ユーザー要件）＆受け入れ基準（機能要求）
# フォーマット：
#   ＜ペルソナ＞として、＜目的/機能＞したい。なぜなら＜価値/理由＞だからだ。
#   受け入れ基準は日本語BDD（【前提】/【もし】/【ならば】）で記述する。
# =============================================================================

user_stories:

  # ===========================================================================
  # 機能領域 1：食行動コントロール
  # ===========================================================================

  - id: US-EAT-01
    title: "食事タイマーによるペーシング"
    actor: "健康意識の高いユーザー"
    goal: "食事開始から20分間、食べるペースをコントロールする手助けをアプリに求めたい"
    reason: "満腹シグナルが脳に届くまでに約20分かかるため、タイマーなしでは食べ過ぎてしまうからだ"
    acceptance_criteria:

      - ac_id: AC-EAT-01
        priority: "Must"
        title: "食事タイマーの開始"
        given:
          - "ユーザーがホーム画面またはタイマー画面を表示している"
        when: "「食事開始」ボタンを押した"
        then: "20分のカウントダウンタイマーが開始し、残り時間が画面上に表示される"

      - ac_id: AC-EAT-02
        priority: "Must"
        title: "タイマー完了通知"
        given:
          - "食事タイマーが動作中である"
        when: "カウントダウンが0分0秒に達した"
        then: "「満腹シグナルが届くタイミングです」という旨のアラートが表示され、タイマーが停止する"

      - ac_id: AC-EAT-03
        priority: "Must"
        title: "タイマーの途中キャンセル"
        given:
          - "食事タイマーが動作中である"
        when: "「キャンセル」ボタンを押した"
        then: "タイマーが停止し、記録は保存されずに初期状態に戻る"

      - ac_id: AC-EAT-04
        priority: "Should"
        title: "食事タイマー履歴の記録"
        given:
          - "食事タイマーが正常に完走した（20分経過した）"
        when: "タイマーが完了した"
        then: "完走した日時がユーザーの食事履歴として記録され、後から確認できる"

  - id: US-EAT-02
    title: "超加工度チェックによる食品可視化"
    actor: "健康意識の高いユーザー"
    goal: "摂取しようとしている食品の超加工度を確認したい"
    reason: "超加工食品はドーパミン報酬系を過剰に刺激するため、摂取前に気づきを得て自己コントロールしたいからだ"
    acceptance_criteria:

      - ac_id: AC-EAT-05
        priority: "Must"
        title: "食品名による超加工度検索"
        given:
          - "ユーザーが食品チェック画面を開いている"
        when: "食品名を入力して検索を実行した"
        then: "該当食品の超加工度スコア（NOVA分類レベル1〜4）と、リスク説明が表示される"

      - ac_id: AC-EAT-06
        priority: "Should"
        title: "超加工度に応じた警告表示"
        given:
          - "検索した食品のNOVA分類が レベル4（超加工食品）と判定された"
        when: "検索結果が表示された"
        then: "「この食品は脳の報酬系を過剰に刺激する可能性があります」という旨の注意メッセージが目立つ形で表示される"

      - ac_id: AC-EAT-07
        priority: "Could"
        title: "本日の食品ログへの追加"
        given:
          - "食品の超加工度検索結果が表示されている"
        when: "「今日食べた」ボタンを押した"
        then: "その食品が本日の食品ログに追加され、当日の超加工度合計スコアが更新される"

  # ===========================================================================
  # 機能領域 2：サーカディアンリズム最適化
  # ===========================================================================

  - id: US-LIGHT-01
    title: "朝の日光浴び記録"
    actor: "健康意識の高いユーザー"
    goal: "朝に太陽光を浴びたことをアプリに記録したい"
    reason: "朝の日光浴はサーカディアンリズムのリセットに不可欠で、記録することで習慣化を促進したいからだ"
    acceptance_criteria:

      - ac_id: AC-LIGHT-01
        priority: "Must"
        title: "朝の日光浴びチェックイン"
        given:
          - "ユーザーが光トラッカー画面を表示している"
          - "現在時刻が午前5時〜午前10時の間である"
        when: "「日光を浴びた」ボタンを押した"
        then: "本日の日光浴び記録が保存され、チェックイン済みの状態が画面に表示される"

      - ac_id: AC-LIGHT-02
        priority: "Must"
        title: "朝の日光浴び未実施リマインド"
        given:
          - "ユーザーが本日まだ日光浴び記録をしていない"
        when: "午前9時を過ぎた"
        then: "「今朝はまだ日光を浴びていません。サーカディアンリズムのために外に出ましょう」という旨の通知が表示される"

      - ac_id: AC-LIGHT-03
        priority: "Should"
        title: "週間日光浴び実績の可視化"
        given:
          - "ユーザーが光トラッカー画面を表示している"
        when: "週間ビューを選択した"
        then: "過去7日間のうち日光浴びを記録した日が視覚的なカレンダーやグラフで確認できる"

  - id: US-LIGHT-02
    title: "夜間デジタル日没モードの有効化"
    actor: "健康意識の高いユーザー"
    goal: "日没後にアプリが自動的に「デジタル日没モード」へ切り替わるよう設定したい"
    reason: "夜間のブルーライト暴露はメラトニン抑制を招くため、意識せずとも睡眠環境を守れるようにしたいからだ"
    acceptance_criteria:

      - ac_id: AC-LIGHT-04
        priority: "Must"
        title: "デジタル日没モードの手動有効化"
        given:
          - "ユーザーが設定画面を表示している"
        when: "「デジタル日没モード」をオンに切り替えた"
        then: "設定が保存され、以降は毎日日没時刻に自動でモードが有効化される旨のメッセージが表示される"

      - ac_id: AC-LIGHT-05
        priority: "Must"
        title: "日没時刻のデジタル日没モード自動通知"
        given:
          - "デジタル日没モードが有効設定になっている"
        when: "ユーザーの位置情報に基づく日没時刻を過ぎた"
        then: "「日没です。画面の輝度を下げ、ブルーライトカットを有効にすることを推奨します」という旨の通知が送られる"

      - ac_id: AC-LIGHT-06
        priority: "Should"
        title: "夜間の人工光暴露時間の可視化"
        given:
          - "ユーザーが光トラッカー画面を表示している"
        when: "本日の夜間暴露サマリーを確認した"
        then: "日没後にアプリを利用していた累計時間が表示され、推奨上限との比較が確認できる"

  # ===========================================================================
  # 機能領域 3：身体活動促進
  # ===========================================================================

  - id: US-MOVE-01
    title: "30分ごとのマイクロムーブリマインド"
    actor: "健康意識の高いユーザー"
    goal: "座りっぱなしが30分続いたタイミングで軽運動のリマインドを受け取りたい"
    reason: "長時間の座位は代謝・循環を低下させるため、習慣的なインターバルで身体を動かしたいからだ"
    acceptance_criteria:

      - ac_id: AC-MOVE-01
        priority: "Must"
        title: "マイクロムーブリマインドの設定"
        given:
          - "ユーザーが設定画面を表示している"
        when: "「マイクロムーブリマインド」をオンに設定し、間隔を選択した（選択肢：20分 / 30分 / 45分）"
        then: "設定が保存され、選択した間隔でリマインドが通知されるようになる"

      - ac_id: AC-MOVE-02
        priority: "Must"
        title: "静止ブロック検出後のリマインド通知"
        given:
          - "マイクロムーブリマインドが有効になっている"
          - "ユーザーが設定した間隔（デフォルト：30分）継続してアプリを操作中、または静止状態である"
        when: "設定間隔が経過した"
        then: "「立ち上がってストレッチをしましょう」等の軽運動を促す通知が表示される"

      - ac_id: AC-MOVE-03
        priority: "Must"
        title: "マイクロムーブの完了記録"
        given:
          - "マイクロムーブのリマインド通知が表示されている"
        when: "「完了」ボタンを押した"
        then: "本日のマイクロムーブ実施回数が1増加し、静止タイマーがリセットされる"

      - ac_id: AC-MOVE-04
        priority: "Should"
        title: "本日の静止継続時間の可視化"
        given:
          - "ユーザーがアクティビティ画面を表示している"
        when: "本日のサマリーを確認した"
        then: "本日の合計静止時間（連続30分超えのブロック数）とマイクロムーブ完了回数がグラフで表示される"

  - id: US-MOVE-02
    title: "NEAT トラッキングによる活動量の可視化"
    actor: "健康意識の高いユーザー"
    goal: "日常的な非運動性活動（NEAT）の記録と可視化を通じて、活動量の改善傾向を把握したい"
    reason: "意識的なスポーツ以外の日常動作こそが体重管理・代謝改善に大きく寄与することを知っており、それを可視化して行動改善につなげたいからだ"
    acceptance_criteria:

      - ac_id: AC-MOVE-05
        priority: "Should"
        title: "日次NEATスコアの表示"
        given:
          - "ユーザーがアクティビティ画面を表示している"
        when: "本日のサマリーを確認した"
        then: "マイクロムーブ完了回数・歩数（デバイス提供値）・静止ブロック数を統合した本日のNEATスコアが表示される"

      - ac_id: AC-MOVE-06
        priority: "Could"
        title: "週間NEATトレンドの確認"
        given:
          - "ユーザーがアクティビティ画面の週間ビューを表示している"
        when: "週間グラフを確認した"
        then: "過去7日間の日次NEATスコア推移が折れ線グラフで表示される"

  # ===========================================================================
  # 機能領域 4：デジタルデトックス・認知保護
  # ===========================================================================

  - id: US-DETOX-01
    title: "バッチ通知モードによるSNS通知の集約"
    actor: "健康意識の高いユーザー"
    goal: "SNSや外部サービスの通知をリアルタイムで受け取らず、指定した時間帯にまとめて確認したい"
    reason: "通知のたびに集中を中断されることで認知負荷が高まり、ドーパミン報酬系が過剰に刺激されるのを防ぎたいからだ"
    acceptance_criteria:

      - ac_id: AC-DETOX-01
        priority: "Must"
        title: "バッチ通知時間帯の設定"
        given:
          - "ユーザーが設定画面を表示している"
        when: "バッチ通知モードをオンにし、通知をまとめて確認する時間帯を1〜3つ設定した"
        then: "設定が保存され、設定時間帯以外では通知バッジが非表示またはサイレントになる旨が確認される"

      - ac_id: AC-DETOX-02
        priority: "Must"
        title: "バッチ時間帯での通知サマリー表示"
        given:
          - "バッチ通知モードが有効である"
          - "設定した通知確認時間帯に到達した"
        when: "通知確認時間帯の開始時刻になった"
        then: "「X件の通知がたまっています」というサマリー通知が届き、一覧を確認できる"

      - ac_id: AC-DETOX-03
        priority: "Should"
        title: "バッチ通知モード中の即時通知ブロック確認"
        given:
          - "バッチ通知モードが有効である"
          - "バッチ時間帯以外の時間帯に外部通知が届いた"
        when: "通知が届いた"
        then: "通知は即時表示されず、次の通知確認時間帯まで保留されたことがアプリ内ログに記録される"

  - id: US-DETOX-02
    title: "フィード遅延機能による報酬刺激の軽減"
    actor: "健康意識の高いユーザー"
    goal: "外部サービスのフィード情報を意図的に遅延表示させ、即時性への依存を低下させたい"
    reason: "リアルタイム更新がドーパミン報酬ループを形成するため、遅延させることで情報への渇望を和らげ、自己コントロールを回復したいからだ"
    acceptance_criteria:

      - ac_id: AC-DETOX-04
        priority: "Should"
        title: "フィード遅延時間の設定"
        given:
          - "ユーザーが設定画面を表示している"
        when: "フィード遅延機能をオンにし、遅延時間を選択した（選択肢：1時間 / 3時間 / 6時間 / 24時間）"
        then: "設定が保存され、以降は設定した遅延時間を経過したコンテンツのみが表示対象となる"

      - ac_id: AC-DETOX-05
        priority: "Should"
        title: "遅延フィルター適用中の表示"
        given:
          - "フィード遅延機能が有効になっている"
        when: "フィード画面を開いた"
        then: "「現在、X時間遅延フィルターが有効です」というバナーが表示され、ユーザーは遅延適用中であることを認識できる"

      - ac_id: AC-DETOX-06
        priority: "Could"
        title: "週間デジタルデトックス達成度の確認"
        given:
          - "ユーザーがデジタルデトックス画面を表示している"
        when: "週間サマリーを確認した"
        then: "バッチ通知遵守日数・フィード遅延有効日数・即時通知ブロック件数が週単位で表示される"

# =============================================================================
# 非機能要求（品質シナリオ）
# =============================================================================

non_functional_requirements:

  - ac_id: NFR-PERF-01
    priority: "Must"
    title: "タイマー操作のレスポンスタイム"
    category: "パフォーマンス"
    source: "ユーザー"
    stimulus: "食事タイマーの「開始」ボタンを押下する"
    environment: "通常のブラウザ利用時（ネットワーク接続あり）"
    target: "タイマー機能"
    response: "タイマーのカウントダウンが開始し、残り時間がUIに反映される"
    measure: "ボタン押下から画面表示更新まで **200ms 以内**"

  - ac_id: NFR-SEC-01
    priority: "Must"
    title: "ユーザー健康データの非公開保護"
    category: "セキュリティ"
    source: "第三者（他ユーザー・未認証者）"
    stimulus: "他ユーザーの食事ログ・活動記録・通知設定へのアクセスを試みる"
    environment: "Supabase Row Level Security 有効時"
    target: "データアクセス制御層"
    response: "当該リクエストは拒否され、データは一切返却されない"
    measure: "認証済みユーザー本人以外のデータ参照が **0件**"

  - ac_id: NFR-AVAIL-01
    priority: "Should"
    title: "サービス可用性"
    category: "可用性"
    source: "ユーザー"
    stimulus: "任意の時刻にアプリへアクセスする"
    environment: "通常稼働時（計画メンテナンス時間を除く）"
    target: "Webアプリケーション全体"
    response: "アプリが正常に応答する"
    measure: "月次稼働率 **99.0% 以上**"

  - ac_id: NFR-USAB-01
    priority: "Must"
    title: "コアアクションの操作ステップ数"
    category: "使いやすさ"
    source: "ユーザー"
    stimulus: "食事タイマーを開始しようとする"
    environment: "ホーム画面から初めて操作する場合"
    target: "食事タイマー機能のUI"
    response: "ユーザーがタイマーを開始できる"
    measure: "ホーム画面からタイマー開始まで **タップ/クリック3回以内**"

